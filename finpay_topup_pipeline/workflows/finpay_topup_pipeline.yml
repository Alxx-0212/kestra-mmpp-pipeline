errors:
  - id: cleanup_failed_refresh
    type: io.kestra.plugin.scripts.python.Script
    containerImage: finpay-topup-pipeline:3.11
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: mmpp-finance-network
    pythonVersion: "3.11"
    timeout: PT5M
    env:
      FINPAY_DB_HOST: "{{ secret('FINPAY_DB_HOST') }}"
      FINPAY_DB_PORT: "{{ secret('FINPAY_DB_PORT') }}"
      FINPAY_DB_NAME: "{{ secret('FINPAY_DB_NAME') }}"
      FINPAY_DB_USER: "{{ secret('FINPAY_DB_USER') }}"
      FINPAY_DB_PASSWORD: "{{ secret('FINPAY_DB_PASSWORD') }}"
    script: |
      import os
      import sys

      sys.path.insert(0, "/app")
      from finpay_topup_pipeline.audit import update_refresh_status
      from finpay_topup_pipeline.config import dsn_from_env
      from finpay_topup_pipeline.loader import purge_staged_rows

      refresh_id_raw = "{{ outputs.prepare_refresh.vars.refresh_id ?? '' }}".strip()
      refresh_id = int(refresh_id_raw) if refresh_id_raw else None
      purged = 0
      status = "none"
      if refresh_id is not None:
          import psycopg

          conn = psycopg.connect(dsn_from_env())
          try:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT status FROM finpay_topup_refresh WHERE refresh_id = %s",
                      (refresh_id,),
                  )
                  row = cur.fetchone()
              status = row[0] if row else "missing"
              if status in {"REQUESTED", "DOWNLOADED", "STAGED", "VERIFY_FAILED"}:
                  purged = purge_staged_rows(conn, refresh_id)
                  update_refresh_status(conn, refresh_id, "FAILED", "Kestra task failed before completion")
                  status = "FAILED"
          finally:
              conn.close()

      print(
          f"event=topup_failure_cleanup refresh_id={refresh_id or '-'} "
          f"status={status} purged_rows={purged}"
      )

  - id: notify_flow_failure
    type: io.kestra.plugin.scripts.python.Script
    containerImage: finpay-topup-pipeline:3.11
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: mmpp-finance-network
    pythonVersion: "3.11"
    timeout: PT5M
    env:
      TELEGRAM_REVIEW_BOT_TOKEN: "{{ secret('FINPAY_TELEGRAM_BOT_TOKEN') }}"
      TELEGRAM_ALERT_CHAT_ID: "{{ secret('TELEGRAM_ALERT_CHAT_ID') }}"
    script: |
      import os
      import sys
      sys.path.insert(0, "/app")
      from finpay_topup_pipeline.notify import format_flow_failure_alert, send_telegram_alert
      review_token = os.environ.get("TELEGRAM_REVIEW_BOT_TOKEN")
      chat_id = os.environ.get("TELEGRAM_ALERT_CHAT_ID")
      text = format_flow_failure_alert(
          "{{ execution.id }}",
          "finance.finpay",
          "finpay_topup_pipeline_v1",
      )
      if review_token and chat_id:
          try:
              # sendMessage remains one-way for technical failure alerts.
              sent = send_telegram_alert(
                  text,
                  token=review_token,
                  chat_id=chat_id,
                  parse_mode="HTML",
              )
              print(f"event=topup_flow_failure_alert status={'sent' if sent else 'skipped'}")
          except Exception as exc:
              print(
                  f"event=topup_flow_failure_alert status=failed "
                  f"error_type={type(exc).__name__}",
                  file=sys.stderr,
              )
      else:
          print(
              "event=topup_flow_failure_alert status=skipped reason=missing_configuration",
              file=sys.stderr,
          )
