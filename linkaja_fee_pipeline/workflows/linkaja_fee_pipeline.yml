  id: linkaja_fee_pipeline_v1
  namespace: finance.linkaja

  concurrency:
    limit: 1
    behavior: QUEUE

  inputs:
    - id: source_file
      type: FILE
      displayName: "LinkAja CSV file"
      description: "Upload one LinkAja CSV export for one cluster. Filename should be laporan-<cluster_id>-....csv."
      required: true

    - id: dry_run
      type: BOOLEAN
      displayName: "Dry run?"
      description: "true → validate only. false → apply pending LinkAja schema migrations, replace affected raw transaction IDs, and calculate database-backed daily results."
      defaults: false

    - id: source_filename
      type: STRING
      displayName: "Original source filename"
      description: "Optional original basename if Kestra stores the FILE as a temporary upload handle."
      defaults: ""

    - id: write_gsheet
      type: BOOLEAN
      displayName: "Write Google Sheets?"
      description: "Write the shared daily LinkAja summary and per-cluster detail tabs after PostgreSQL succeeds."
      defaults: true

  tasks:
    - id: validate_and_normalize_linkaja_csv
      type: io.kestra.plugin.scripts.python.Script
      containerImage: linkaja-fee-pipeline:3.11
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: mmpp-finance-network
      pythonVersion: "3.11"
      timeout: PT10M
      inputFiles:
        source_file: "{{ inputs.source_file }}"
      outputFiles:
        - normalized_linkaja.csv
        - linkaja_manifest.json
      env:
        ORIGINAL_FILE_PATH: "{{ inputs.source_filename }}"
        LOAD_ID: "{{ execution.id }}"
        DRY_RUN: "{{ inputs.dry_run }}"
      script: |
        import os
        import sys
        from kestra import Kestra

        sys.path.insert(0, "/app")
        from linkaja_fee_pipeline import normalize_linkaja_csv, write_linkaja_manifest

        original_file_path = os.environ.get("ORIGINAL_FILE_PATH", "source_file")
        try:
            manifest = normalize_linkaja_csv(
                "source_file",
                "normalized_linkaja.csv",
            filename_hint=os.path.basename(original_file_path) if original_file_path.strip() else None,
                load_id=os.environ["LOAD_ID"],
            )
        except Exception as exc:
            print(f"❌ LinkAja CSV validation failed: {exc}", file=sys.stderr)
            sys.exit(1)

        write_linkaja_manifest(manifest, "linkaja_manifest.json")
        print(f"📄 Source file : {manifest.source_file}")
        print(f"🗂  Cluster     : {manifest.cluster_id}")
        print(f"📅 Dates       : {', '.join(manifest.report_dates)}")
        print(f"📊 Raw rows    : {manifest.source_rows}")
        for scenario, count in manifest.scenario_counts.items():
            print(f"  {scenario}: {count}")
        if os.environ.get("DRY_RUN", "false").lower() == "true":
            print("⚠️  DRY RUN — PostgreSQL writes will be skipped.")

        Kestra.outputs({
            "cluster_id": manifest.cluster_id,
            "source_file": manifest.source_file,
            "source_rows": manifest.source_rows,
            "report_dates": manifest.report_dates,
            "scenario_counts": manifest.scenario_counts,
        })

    - id: persist_and_summarize_linkaja
      type: io.kestra.plugin.scripts.python.Script
      runIf: "{{ inputs.dry_run == false }}"
      containerImage: linkaja-fee-pipeline:3.11
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: mmpp-finance-network
      pythonVersion: "3.11"
      timeout: PT15M
      retry:
        type: exponential
        interval: PT10S
        maxInterval: PT60S
        maxAttempts: 3
      inputFiles:
        normalized_linkaja.csv: "{{ outputs.validate_and_normalize_linkaja_csv.outputFiles['normalized_linkaja.csv'] }}"
        linkaja_manifest.json: "{{ outputs.validate_and_normalize_linkaja_csv.outputFiles['linkaja_manifest.json'] }}"
      outputFiles:
        - linkaja_database_result.json
      env:
        FINPAY_DB_HOST: "{{ secret('FINPAY_DB_HOST') }}"
        FINPAY_DB_PORT: "{{ secret('FINPAY_DB_PORT') }}"
        FINPAY_DB_NAME: "{{ secret('FINPAY_DB_NAME') }}"
        FINPAY_DB_USER: "{{ secret('FINPAY_DB_USER') }}"
        FINPAY_DB_PASSWORD: "{{ secret('FINPAY_DB_PASSWORD') }}"
      script: |
        import sys
        from kestra import Kestra

        sys.path.insert(0, "/app")
        from linkaja_fee_pipeline import (
            linkaja_postgres_dsn_from_env,
            load_linkaja_manifest,
            migrate_linkaja_database,
            persist_linkaja_normalized_csv,
            write_linkaja_database_result,
        )

        try:
            dsn = linkaja_postgres_dsn_from_env()
            migration = migrate_linkaja_database(dsn)
            manifest = load_linkaja_manifest("linkaja_manifest.json")
            result = persist_linkaja_normalized_csv(
                "normalized_linkaja.csv",
                manifest,
                dsn,
            )
        except Exception as exc:
            print(f"❌ LinkAja PostgreSQL processing failed: {exc}", file=sys.stderr)
            sys.exit(1)

        write_linkaja_database_result(result, "linkaja_database_result.json")
        print(f"✅ Current schema version   : {migration['current_version']}")
        print(f"⬆️  Applied schema versions : {migration['applied_versions']}")
        print(f"✅ Raw rows replaced       : {result['raw_rows']}")
        print(f"✅ Impacted transaction IDs: {result['impacted_transaction_ids']}")
        print(f"✅ Current transaction rows: {result['transaction_rows']}")
        print(f"📅 Summary dates          : {', '.join(result['report_dates'])}")
        print(f"📒 Ledger measure rows    : {len(result['detail_rows'])}")
        Kestra.outputs({
            "cluster_id": result["cluster_id"],
            "schema_version": migration["current_version"],
            "applied_schema_versions": migration["applied_versions"],
            "raw_rows": result["raw_rows"],
            "impacted_transaction_ids": result["impacted_transaction_ids"],
            "transaction_rows": result["transaction_rows"],
            "report_dates": result["report_dates"],
            "detail_rows": len(result["detail_rows"]),
            "ledger_measure_rows": len(result["detail_rows"]),
        })

    - id: write_linkaja_daily_sheets
      type: io.kestra.plugin.scripts.python.Script
      runIf: "{{ inputs.dry_run == false and inputs.write_gsheet }}"
      containerImage: linkaja-fee-pipeline:3.11
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: host
      pythonVersion: "3.11"
      timeout: PT10M
      retry:
        type: exponential
        interval: PT10S
        maxInterval: PT60S
        maxAttempts: 3
      inputFiles:
        linkaja_database_result.json: "{{ outputs.persist_and_summarize_linkaja.outputFiles['linkaja_database_result.json'] }}"
      outputFiles:
        - linkaja_google_write_result.json
      env:
        SECRET_GCP_SA_KEY: "{{ secret('GCP_SA_KEY') }}"
        TARGET_SPREADSHEET: "Salinan dari Monitoring Finpay & LinkAja"
      script: |
        import json
        import os
        import sys
        import tempfile
        from kestra import Kestra

        sys.path.insert(0, "/app")
        from linkaja_fee_pipeline.sheets import (
            make_gspread_client,
            process_linkaja_detail_sheet_upload,
            process_linkaja_fee_sheet_upload,
        )

        with open("linkaja_database_result.json", encoding="utf-8") as handle:
            result = json.load(handle)
        key_json = os.environ.get("SECRET_GCP_SA_KEY", "")
        if not key_json or key_json.strip() == "{}":
            raise ValueError("GCP_SA_KEY is empty or not configured in Kestra")

        credential_path = None
        try:
            with tempfile.NamedTemporaryFile(mode="w", suffix=".json", delete=False) as handle:
                handle.write(key_json)
                credential_path = handle.name
            client = make_gspread_client(credential_path)
            summary_result = process_linkaja_fee_sheet_upload(
                target_spreadsheet=os.environ["TARGET_SPREADSHEET"],
                target_worksheet="LinkAja",
                rows=result.get("fee_rows", []),
                gspread_client=client,
            )
            detail_result = process_linkaja_detail_sheet_upload(
                target_spreadsheet=os.environ["TARGET_SPREADSHEET"],
                cluster_id=result["cluster_id"],
                rows=result.get("detail_rows", []),
                report_dates=result.get("report_dates", []),
                gspread_client=client,
            )
        finally:
            if credential_path and os.path.exists(credential_path):
                os.unlink(credential_path)

        write_result = {
            "spreadsheet": os.environ["TARGET_SPREADSHEET"],
            "summary": summary_result,
            "detail": detail_result,
        }
        with open("linkaja_google_write_result.json", "w", encoding="utf-8") as handle:
            json.dump(write_result, handle, indent=2, default=str)
        print(f"✅ LinkAja summary worksheet: {summary_result['worksheet']}")
        print(f"✅ LinkAja detail worksheet: {detail_result['worksheet']}")
        Kestra.outputs({
            "summary_worksheet": summary_result["worksheet"],
            "detail_worksheet": detail_result["worksheet"],
            "summary_rows": summary_result["rows"],
            "detail_rows": detail_result["rows"],
            "report_dates": detail_result["report_dates"],
        })
