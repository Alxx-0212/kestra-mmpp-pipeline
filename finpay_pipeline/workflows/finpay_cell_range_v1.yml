id: finpay_cell_range_v1
namespace: finance.finpay

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: start_date
    type: STRING
    required: true
  - id: end_date
    type: STRING
    required: true
  - id: cluster_id
    type: STRING
    required: true
    description: "One configured cell cluster or ALL. Dates are inclusive."
  - id: dry_run
    type: BOOLEAN
    defaults: true
  - id: write_gsheet
    type: BOOLEAN
    defaults: false

tasks:
  - id: expand_cell_range
    type: io.kestra.plugin.scripts.python.Script
    containerImage: finpay-cell-reporting:2.0
    timeout: PT1M
    env:
      START_DATE: "{{ inputs.start_date }}"
      END_DATE: "{{ inputs.end_date }}"
      CLUSTER_ID: "{{ inputs.cluster_id }}"
      WRITE_GSHEET: "{{ inputs.write_gsheet }}"
    script: |
      import os
      from kestra import Kestra
      from finpay_pipeline.cell_format import expand_cell_range, validate_sheet_range

      runs = expand_cell_range(
          os.environ["START_DATE"], os.environ["END_DATE"], os.environ["CLUSTER_ID"],
      )
      if os.environ["WRITE_GSHEET"].lower() == "true":
          validate_sheet_range(
              os.environ["START_DATE"], os.environ["END_DATE"], os.environ["CLUSTER_ID"],
          )
      Kestra.outputs({"runs": runs, "count": len(runs)})

  - id: process_cell_range_sequentially
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.expand_cell_range.vars.runs }}"
    concurrencyLimit: 1
    tasks:
      - id: process_cell_day
        type: io.kestra.plugin.core.flow.Subflow
        namespace: finance.finpay
        flowId: finpay_cell_day_v1
        wait: true
        transmitFailed: true
        inputs:
          report_date: "{{ fromJson(taskrun.value).report_date }}"
          cluster_id: "{{ fromJson(taskrun.value).cluster_id }}"
          dry_run: "{{ inputs.dry_run }}"
          write_gsheet: "{{ inputs.write_gsheet }}"
