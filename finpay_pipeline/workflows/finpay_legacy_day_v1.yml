id: finpay_legacy_day_v1
namespace: finance.finpay

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: report_date
    type: STRING
    required: true
  - id: cluster_id
    type: STRING
    required: true
  - id: dry_run
    type: BOOLEAN
    defaults: true
  - id: write_gsheet
    type: BOOLEAN
    defaults: false
  - id: send_telegram
    type: BOOLEAN
    defaults: false

tasks:
  - id: acquire_legacy_cluster_day
    type: io.kestra.plugin.scripts.python.Script
    containerImage: finpay-digipos-scraper:1.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    timeout: PT2H
    env:
      DIGIPOS_PASSWORD: "{{ secret('DIGIPOS_PASSWORD') }}"
      REPORT_DATE: "{{ inputs.report_date }}"
      CLUSTER_ID: "{{ inputs.cluster_id }}"
    outputFiles:
      - source.xlsx
      - legacy_acquisition_manifest.json
    script: |
      import os
      from kestra import Kestra
      from finpay_pipeline.legacy.acquisition import acquire_legacy_day

      try:
          result = acquire_legacy_day(
              os.environ["REPORT_DATE"], os.environ["CLUSTER_ID"],
              os.environ["DIGIPOS_PASSWORD"], os.getcwd(),
          )
      except Exception as exc:
          raise RuntimeError("Legacy acquisition failed: " + type(exc).__name__) from None
      Kestra.outputs({key: result[key] for key in ("report_date", "cluster_id", "filename", "row_count", "sha256")})

  - id: verify_legacy_internal_handoff
    type: io.kestra.plugin.scripts.python.Script
    containerImage: finpay-pipeline:3.11
    timeout: PT1M
    inputFiles:
      source.xlsx: "{{ outputs.acquire_legacy_cluster_day.outputFiles['source.xlsx'] }}"
      legacy_acquisition_manifest.json: "{{ outputs.acquire_legacy_cluster_day.outputFiles['legacy_acquisition_manifest.json'] }}"
    env:
      EXPECTED_SHA256: "{{ outputs.acquire_legacy_cluster_day.vars.sha256 }}"
      REPORT_DATE: "{{ inputs.report_date }}"
      CLUSTER_ID: "{{ inputs.cluster_id }}"
    outputFiles:
      - source.xlsx
    script: |
      import os
      from kestra import Kestra
      from finpay_pipeline.legacy import verify_legacy_artifact

      try:
          result = verify_legacy_artifact(
              "source.xlsx", "legacy_acquisition_manifest.json",
              os.environ["EXPECTED_SHA256"], os.environ["REPORT_DATE"],
              os.environ["CLUSTER_ID"],
          )
      except Exception as exc:
          raise RuntimeError("Legacy artifact handoff verification failed: " + type(exc).__name__) from None
      Kestra.outputs(result)

  - id: process_previous_daily_v5
    type: io.kestra.plugin.core.flow.Subflow
    namespace: finance.finpay
    flowId: finpay_daily_pipeline_v5
    wait: true
    transmitFailed: true
    inputs:
      csv_file: "{{ outputs.verify_legacy_internal_handoff.outputFiles['source.xlsx'] }}"
      source_filename: "{{ outputs.verify_legacy_internal_handoff.vars.filename }}"
      dry_run: "{{ inputs.dry_run }}"
      write_gsheet: "{{ inputs.write_gsheet }}"
      send_telegram: "{{ inputs.send_telegram }}"
