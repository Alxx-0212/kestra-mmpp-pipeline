[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 2

# Context7 MCP server (remote, hosted). Provides up-to-date, version-specific
# documentation and code examples for the libraries used in this project.
# No local process required; Codex connects over streamable HTTP.
# Optional: set CONTEXT7_API_KEY in the environment for higher rate limits and
# access to private repositories. When unset, anonymous (rate-limited) access is used.
[mcp_servers.context7]
enabled = true
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"

[mcp_servers.superset]
enabled = true
url = "http://localhost:5008/mcp"
